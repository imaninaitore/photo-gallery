{% extends "base.html" %}

{% block title %}
    Edit Profile | Photo Gallery
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow">

    <h1 class="text-2xl font-bold mb-6">
        Edit Profile
    </h1>


    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}


        <h2 class="font-bold text-lg mb-3">
            Account Information
        </h2>

        {{ user_form.as_p }}


        <h2 class="font-bold text-lg mt-6 mb-3">
            Profile Information
        </h2>

        {{ profile_form.as_p }}


        <button type="submit"
                class="bg-slate-900 text-white px-6 py-3 rounded mt-4">

            Save Profile

        </button>

    </form>

</div>

{% endblock %}
