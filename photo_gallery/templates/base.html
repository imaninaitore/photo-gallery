{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Photo Gallery
        {% endblock %}
    </title>
    
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 text-gray-900 min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-slate-900 text-white">

        <div class="max-w-7xl mx-auto px-4">

            <div class="flex justify-between items-center h-16">

                <!-- Website name -->
                <a href="{% url 'home' %}"
                   class="text-xl font-bold">
                    Photo Gallery
                </a>


                <!-- Navigation -->

                <div class="flex items-center gap-4">

                    <a href="{% url 'home' %}"
                       class="hover:text-gray-300">
                        Home
                    </a>

                    <a href="{% url 'gallery' %}"
                       class="hover:text-gray-300">
                        Gallery
                    </a>

                    <a href="{% url 'about' %}"
                       class="hover:text-gray-300">
                        About
                    </a>


                    {% if user.is_authenticated %}

                        <!--links only appear when the user is logged in. -->

                        <a href="{% url 'upload_photo' %}"
                           class="hover:text-gray-300">
                            Upload
                        </a>

                        <a href="{% url 'profile' user.username %}"
                           class="hover:text-gray-300">
                            Profile
                        </a>

                        <a href="{% url 'edit_profile' %}"
                           class="hover:text-gray-300">
                            Settings
                        </a>

                        <!--
                            Logout is POST because Django's
                            LogoutView expects a POST request.
                        -->

                        <form method="POST"
                              action="{% url 'logout' %}"
                              class="inline">

                            {% csrf_token %}

                            <button type="submit"
                                    class="hover:text-gray-300">

                                Logout

                            </button>

                        </form>

                    {% else %}

                        <!-- Links for visitors -->

                        <a href="{% url 'login' %}"
                           class="hover:text-gray-300">

                            Login

                        </a>

                        <a href="{% url 'register' %}"
                           class="bg-white text-slate-900 px-3 py-2 rounded">

                            Register

                        </a>

                    {% endif %}

                </div>

            </div>

        </div>

    </nav>


    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main class="max-w-7xl mx-auto px-4 py-8">

        {% block content %}
        {% endblock %}

    </main>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="bg-slate-900 text-white mt-12">

        <div class="max-w-7xl mx-auto px-4 py-6 text-center">

            <p>
                Photo Gallery
            </p>

        </div>

    </footer>

</body>

</html>
