{% extends "base.html" %}

{% block content %}

<h1>Photo Gallery</h1>

{% for photo in photos %}

    <h2>{{ photo.title }}</h2>
#Make gallery photos clickable
    <a href="{% url 'photo_detail' photo.id %}">
    <img src="{{ photo.image.url }}" alt="{{ photo.title }}">
    </a>

    <p>{{ photo.description }}</p>

    <p>Tags: {{ photo.tags }}</p>

{% endfor %}

{% endblock %}
