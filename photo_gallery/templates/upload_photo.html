{% extends "base.html" %}

{% block title %}
    Upload Photo | Photo Gallery
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow">

    <h1 class="text-2xl font-bold mb-6">
        Upload Photo
    </h1>


    <!--
        enctype="multipart/form-data" is REQUIRED
        when uploading files.

        Without it, the image will not reach Django.
    -->

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit"
                class="bg-slate-900 text-white px-6 py-3 rounded mt-4">

            Upload Photo

        </button>

    </form>

</div>

{% endblock %}
