{% extends "base.html" %}

{% block title %}
    Delete Photo | Photo Gallery
{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">

    <h1 class="text-2xl font-bold">
        Delete Photo
    </h1>

    <p class="mt-4">
        Are you sure you want to delete
        <strong>{{ photo.title }}</strong>?
    </p>


    <!--
        We use POST for deletion.

        DELETE operations should not normally be
        performed with a simple GET link.
    -->

    <form method="POST"
          class="mt-6">

        {% csrf_token %}

        <button type="submit"
                class="bg-red-600 text-white px-5 py-2 rounded">

            Yes, Delete

        </button>

        <a href="{% url 'photo_detail' photo.id %}"
           class="ml-3 text-gray-600">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
