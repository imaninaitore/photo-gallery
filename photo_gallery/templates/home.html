{% extends "base.html" %}

{% load static %}

{% block title %}
    Home | Photo Gallery
{% endblock %}

{% block content %}

<div
    class="min-h-screen bg-cover bg-center flex items-center justify-center">

    <div class="text-center text-white bg-black/60 p-10 rounded-xl max-w-2xl">

        <h1 class="text-4xl md:text-5xl font-bold mb-5">
            Welcome to Photo Gallery
        </h1>

        <p class="text-lg mb-6">
            Discover beautiful photos, portraits and artwork.
        </p>

        <a
            href="{% url 'gallery' %}"
            class="inline-block bg-white text-slate-900 px-6 py-3 rounded-lg font-semibold hover:bg-gray-200 transition"
        >
            View Gallery
        </a>

    </div>

</div>

{% endblock %}
