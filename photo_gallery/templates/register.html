{% extends "base.html" %}

{% block title %}
    Register | Photo Gallery
{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">

    <h1 class="text-2xl font-bold mb-6">
        Create Account
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="w-full bg-slate-900 text-white py-3 rounded mt-4">

            Register

        </button>

    </form>

    <p class="mt-5">

        Already have an account?

        <a href="{% url 'login' %}"
           class="text-blue-600">

            Login

        </a>

    </p>

</div>

{% endblock %}
