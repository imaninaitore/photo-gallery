{% extends "base.html" %}

{% block title %}
    Change Password | Photo Gallery
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow">

    <h1 class="text-2xl font-bold mb-6">
        Change Password
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="bg-slate-900 text-white px-6 py-3 rounded">

            Change Password

        </button>

    </form>

</div>

{% endblock %}
